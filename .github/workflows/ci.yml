name: hot-ui CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - name: Install
        run: composer install --no-progress --no-interaction
      - name: PHPUnit
        run: composer test
      - name: Validate composer.json
        run: composer validate --strict --no-check-publish
      - name: Runtime must not require plugins at install
        run: test -z "$(composer show -N | grep -v '^composer-plugin-api$')" || true